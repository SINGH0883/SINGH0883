<svg width="100%" height="auto" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 600;
      font-size: 21px;
      letter-spacing: 1.5px;
      fill: #E2E8F0;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 2.5px;
      fill: #38BDF8;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #94A3B8;
    }
  </style>

  <!-- Card Background with Rounded Corners -->
  <rect width="1200" height="260" rx="20" fill="url(#bgGradient)"/>

  <!-- Subtle Tech Grid Overlay -->
  <rect width="1200" height="260" rx="20" fill="url(#grid)"/>

  <!-- Ambient Glow Effects -->
  <rect width="1200" height="260" rx="20" fill="url(#cyanGlow)"/>
  <rect width="1200" height="260" rx="20" fill="url(#purpleGlow)"/>

  <!-- Card Border -->
  <rect x="1" y="1" width="1198" height="258" rx="19" stroke="url(#textGradient)" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>

  <!-- Top Accent Line -->
  <line x1="450" y1="2" x2="750" y2="2" stroke="url(#textGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Header Content -->
  <!-- Tagline Overline -->
  <text x="600" y="65" text-anchor="middle" class="tagline">✦ PORTFOLIO &amp; ENGINEERING ARSENAL ✦</text>

  <!-- Main Name Title -->
  <text x="600" y="128" text-anchor="middle" class="title" fill="url(#textGradient)">YUVRAJ SINGH</text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" class="subtitle">Founder &amp; COO @ Solvane Technologies  •  AI &amp; DS Scholar</text>

  <!-- Bottom Wave Ribbon -->
  <path d="M0 220 C 300 260, 500 200, 800 240 C 1000 265, 1120 225, 1200 235 L 1200 260 L 0 260 Z" fill="url(#waveGradient)" fill-opacity="0.3"/>
  <path d="M0 235 C 350 205, 650 260, 950 225 C 1080 210, 1150 245, 1200 250 L 1200 260 L 0 260 Z" fill="url(#waveGradient)" fill-opacity="0.5"/>
  <path d="M0 248 C 400 235, 800 260, 1200 248 L 1200 260 L 0 260 Z" fill="url(#waveGradient)"/>
</svg>
