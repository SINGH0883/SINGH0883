name: Refresh Profile Stats Cache

on:
  schedule:
    # Auto-refresh stats cache every hour
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Update Cache Busting Token in README
        run: |
          TIMESTAMP=$(date +%s)
          echo "Updating cache bust timestamp to: $TIMESTAMP"
          sed -i -E "s/cb=[0-9]+/cb=${TIMESTAMP}/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-refresh stats cache timestamp [skip ci]"
            git push
          fi
